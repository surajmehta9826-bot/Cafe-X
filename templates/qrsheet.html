<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{{ cafe }} · QR sheet</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f4efe9;
      color: #2b2118;
    }

    h1 {
      color: #8b5a2b;
      text-align: center;
      margin: 0 0 4px;
      letter-spacing: 0.03em;
    }

    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      border: 2px dashed #8b5a2b;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      background: #fff;
      break-inside: avoid;
      box-shadow: 0 1px 4px rgba(139, 90, 43, 0.08);
    }

    .card h3 {
      margin: 0;
      color: #8b5a2b;
      font-size: 16px;
    }

    .card .small {
      color: #999;
      font-size: 12px;
      margin: 4px 0 10px;
    }

    .card img {
      width: 180px;
      height: 180px;
      display: block;
      margin: 8px auto;
    }

    .card b {
      display: block;
      font-size: 24px;
      color: #2b2118;
      margin-top: 8px;
    }

    .top {
      text-align: center;
      margin-bottom: 20px;
    }

    .top button {
      background: linear-gradient(135deg, #8b5a2b, #6d4620);
      color: #fff;
      border: 0;
      padding: 10px 22px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .top button:hover { box-shadow: 0 4px 14px rgba(139, 90, 43, 0.3); }

    .top a {
      margin-left: 14px;
      color: #8b5a2b;
      text-decoration: none;
      font-size: 14px;
    }

    .top a:hover { text-decoration: underline; }

    @media print {
      body { padding: 0; background: #fff; }
      .top { display: none; }
      .card { border-style: solid; border-color: #bbb; box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="top">
    <button onclick="print()">🖨 Print QR sheet</button>
    <a href="/admin#tables">← Back to tables</a>
  </div>

  <h1>{{ cafe }}</h1>
  <p class="subtitle">Scan with your phone to view the menu and place an order</p>

  <div class="grid">
    {% for t in tables %}
      <div class="card">
        <h3>{{ cafe }}</h3>
        <div class="small">Scan to order</div>
        <img src="/admin/qr/{{ t.id }}.png" alt="QR Table {{ t.name }}">
        <b>Table {{ t.name }}</b>
      </div>
    {% endfor %}
  </div>
</body>
</html>
