<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>{{cafe}}</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f4efe9;padding-bottom:80px;color:#2b2118}
header{background:#8b5a2b;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:720px;margin:auto}.c{background:#fff;border-radius:12px;padding:12px;margin:8px 0}
input{padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin:4px 0;width:100%}
button{background:#8b5a2b;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:15px;cursor:pointer}button:disabled{background:#bbb}button.g{background:#eee;color:#333}
nav{display:flex;gap:8px;overflow-x:auto;padding:4px 0;position:sticky;top:44px;background:#f4efe9;z-index:4}nav a{white-space:nowrap;background:#fff;padding:6px 12px;border-radius:99px;color:#8b5a2b;text-decoration:none;font-size:14px}
h3{margin:18px 0 4px}.i{display:flex;gap:10px;align-items:center}.i img{width:72px;height:72px;object-fit:cover;border-radius:10px}.i .t{flex:1}.i small{color:#777;display:block}
.v{display:inline-block;width:10px;height:10px;border:1px solid #2a2;border-radius:2px;margin-right:4px;background:radial-gradient(#2a2 40%,#fff 45%)}.v.n{border-color:#c33;background:radial-gradient(#c33 40%,#fff 45%)}
.f{color:#c9965a;font-size:12px}.bar{position:fixed;left:0;right:0;bottom:0;background:#8b5a2b;color:#fff;padding:12px 16px;display:none;justify-content:space-between;align-items:center;z-index:6;cursor:pointer}
.bd{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:10}.sh{background:#fff;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:720px;max-height:85vh;overflow:auto}
.r{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #eee;gap:8px}.q button{padding:3px 10px}.err{color:#c33}label{display:block;padding:5px 0}
.bar2{height:8px;background:#eee;border-radius:99px;overflow:hidden}.bar2 div{height:100%;background:#c9965a}</style></head>
<body>{% include '_csrf.html' %}
<header><b>{{cafe}}</b><span>Table {{table.name}}</span></header><main>
{% if not customer %}<form method=post action=/join class=c><b>Welcome! Tell us who you are</b><br><small>Your phone number tracks your loyalty rewards.</small>
<input name=name placeholder="Your name" required maxlength=80><input name=phone type=tel placeholder="Phone number" required><button style=width:100%>Continue</button></form>
{% else %}<div class=c>Hi {{customer.name}} 👋</div>{% endif %}
<div id=loy></div><div id=track></div><nav id=nav></nav><div id=menu>Loading menu…</div></main>
<div class=bar id=bar onclick=openCart()><span id=bc></span><b id=bt></b></div>
<div class=bd id=bd onclick="if(event.target==this)closeSheet()"><div class=sh id=sh></div></div>
<script>
const LOGGED={{ 'true' if customer else 'false' }};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>'Rs. '+Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});
let D=null,cart=[],IT={},useReward=false;
async function load(){
  D=await(await fetch('/api/menu')).json();
  D.cats.forEach(c=>c.items.forEach(i=>IT[i.id]=i));
  $('#nav').innerHTML=D.cats.filter(c=>c.items.length).map(c=>`<a href="#c${c.id}">${esc(c.name)}</a>`).join('');
  $('#menu').innerHTML=D.cats.filter(c=>c.items.length).map(c=>`<h3 id="c${c.id}">${esc(c.name)}</h3>`+c.items.map(i=>`
   <div class="c i">${i.img?`<img src="${esc(i.img)}" alt="" loading=lazy>`:''}<div class=t>
   <b><span class="v ${i.veg?'':'n'}"></span>${esc(i.name)}</b>${i.featured?' <span class=f>★ Popular</span>':''}<small>${esc(i.desc)}</small><b>${fmt(i.price)}</b></div>
   ${i.available?`<button onclick="pick(${i.id})">Add</button>`:'<small>Sold out</small>'}</div>`).join('')).join('')||'<div class=c>Menu is empty.</div>';
  const l=D.loyalty;
  if(l)$('#loy').innerHTML=`<div class=c>🎁 Loyalty: ${l.progress}/${l.required} orders${l.reward?' — <b>reward available!</b>':''}<div class=bar2><div style="width:${l.progress/l.required*100}%"></div></div></div>`;
}
function pick(id){
  const it=IT[id];
  if(!LOGGED){alert('Please enter your name and phone first.');scrollTo(0,0);return}
  if(!it.variants.length&&!it.addons.length)return add(it,null,[]);
  $('#sh').innerHTML=`<h3 style=margin-top:0>${esc(it.name)}</h3>
   ${it.variants.length?'<b>Choose one</b>'+it.variants.map((v,k)=>`<label><input type=radio name=vr style=width:auto value="${v.id}" ${k?'':'checked'}> ${esc(v.name)} ${v.delta?'(+'+fmt(v.delta)+')':''}</label>`).join(''):''}
   ${it.addons.length?'<br><b>Add-ons</b>'+it.addons.map(a=>`<label><input type=checkbox class=ad style=width:auto value="${a.id}"> ${esc(a.name)} (+${fmt(a.price)})</label>`).join(''):''}
   <br><button onclick="confirmPick(${id})">Add to cart</button> <button class=g onclick=closeSheet()>Cancel</button>`;
  $('#bd').style.display='flex';
}
function confirmPick(id){
  const it=IT[id],r=document.querySelector('input[name=vr]:checked');
  const v=r?it.variants.find(x=>x.id==r.value):null,aids=[...document.querySelectorAll('.ad:checked')].map(x=>+x.value);
  add(it,v,aids);closeSheet();
}
function add(it,v,aids){
  const ad=it.addons.filter(a=>aids.includes(a.id));
  const price=it.price+(v?v.delta:0)+ad.reduce((s,a)=>s+a.price,0);
  const label=it.name+(v?` (${v.name})`:'')+ad.map(a=>' +'+a.name).join('');
  const key=[it.id,v?v.id:0,aids.slice().sort().join('.')].join('|'),ex=cart.find(l=>l.key==key);
  if(ex)ex.qty++;else cart.push({key,id:it.id,vid:v?v.id:null,aids,label,price,qty:1});
  bar();
}
const sub=()=>cart.reduce((s,l)=>s+l.price*l.qty,0);
function bar(){const n=cart.reduce((s,l)=>s+l.qty,0);$('#bar').style.display=n?'flex':'none';$('#bc').textContent=n+' item'+(n>1?'s':'')+' · View cart';$('#bt').textContent=fmt(sub())}
function qty(k,d){const l=cart[k];l.qty+=d;if(l.qty<=0)cart.splice(k,1);bar();cart.length?openCart():closeSheet()}
function openCart(){
  const s=sub(),l=D&&D.loyalty,cfg=D&&D.loyalty_cfg,canR=l&&l.reward&&s>=cfg.min_order;
  if(!canR)useReward=false;
  $('#sh').innerHTML=`<h3 style=margin-top:0>Your order</h3>`+cart.map((x,k)=>`<div class=r><span>${esc(x.label)}<br><small>${fmt(x.price)}</small></span>
   <span class=q><button class=g onclick="qty(${k},-1)">−</button> ${x.qty} <button class=g onclick="qty(${k},1)">+</button></span></div>`).join('')+
   `<p><b>Subtotal: ${fmt(s)}</b><br><small>Any active promotion is applied automatically at checkout.</small></p>
   ${canR?`<label><input type=checkbox style=width:auto ${useReward?'checked':''} onchange="useReward=this.checked"> Use loyalty reward (${cfg.percent}% off, up to ${fmt(cfg.max_discount)})</label>`:''}
   <div id=oe class=err></div><button id=pb onclick=place()>Place order</button> <button class=g onclick=closeSheet()>Close</button>`;
  $('#bd').style.display='flex';
}
function closeSheet(){$('#bd').style.display='none'}
async function place(){
  $('#pb').disabled=true;$('#oe').textContent='';
  try{
    const r=await fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:cart.map(l=>({id:l.id,qty:l.qty,vid:l.vid,aids:l.aids})),use_reward:useReward})});
    let d={};try{d=await r.json()}catch(e){}
    if(!r.ok){$('#oe').textContent=d.error||(r.status==429?'Too many requests, please wait a moment.':'Could not place order. Please try again.');$('#pb').disabled=false;return}
    cart=[];useReward=false;bar();closeSheet();localStorage.setItem('oid',d.id);localStorage.setItem('onum',d.number);track();scrollTo(0,0);load();
  }catch(e){$('#oe').textContent='Network error. Please try again.';$('#pb').disabled=false}
}
let timer=null;
async function track(){
  const id=localStorage.getItem('oid');if(!id)return;clearTimeout(timer);
  try{
    const r=await fetch('/api/order/'+id);
    if(!r.ok){localStorage.removeItem('oid');$('#track').innerHTML='';return}
    const d=await r.json();
    $('#track').innerHTML=`<div class=c>🧾 Order #${esc(localStorage.getItem('onum'))}<br><b>${esc(d.message)}</b>${d.status=='completed'||d.status=='cancelled'?' <button class=g onclick="localStorage.removeItem(\'oid\');$(\'#track\').innerHTML=\'\'">Dismiss</button>':''}</div>`;
    if(d.status!='completed'&&d.status!='cancelled')timer=setTimeout(track,5000);
  }catch(e){timer=setTimeout(track,8000)}
}
load();if(LOGGED)track();
</script></body></html>
