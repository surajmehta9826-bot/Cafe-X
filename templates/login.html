<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>{{cafe}} · Admin login</title>
<style>body{font-family:system-ui;margin:0;background:#f4efe9;display:flex;min-height:100vh;align-items:center;justify-content:center}
form{background:#fff;border-radius:14px;padding:24px;width:min(340px,90vw);box-shadow:0 4px 16px #0002}h2{margin:0 0 4px;color:#8b5a2b}p{margin:0 0 14px;color:#777}
input{display:block;width:100%;box-sizing:border-box;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:11px;border:0;border-radius:8px;background:#8b5a2b;color:#fff;font-size:16px;cursor:pointer}.e{color:#c33;margin:6px 0}</style></head>
<body>{% include '_csrf.html' %}
<form method=post action=/admin/login><h2>{{cafe}}</h2><p>Admin sign in</p>
{% if err %}<div class=e>{{err}}</div>{% endif %}
<input name=username placeholder=Username autocomplete=username required autofocus>
<input name=password type=password placeholder=Password autocomplete=current-password required>
<button>Sign in</button></form></body></html>
