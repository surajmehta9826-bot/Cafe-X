<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ cafe }} — Admin login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      color: #2b2118;
      background-color: #f4efe9;
      background-image:
        radial-gradient(circle at 15% 15%, #fdf6ec 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, #f9efe0 0%, transparent 40%),
        linear-gradient(135deg, #f4efe9 0%, #f7f1e7 50%, #f0e6d5 100%);
      background-attachment: fixed;
    }

    form {
      background: #fff;
      border-radius: 14px;
      padding: 28px 24px;
      width: min(360px, 92vw);
      box-shadow: 0 10px 30px rgba(139, 90, 43, 0.15);
      border-top: 5px solid #8b5a2b;
    }

    h2 {
      margin: 0 0 4px;
      color: #8b5a2b;
      font-size: 22px;
      letter-spacing: 0.02em;
    }

    p {
      margin: 0 0 18px;
      color: #888;
      font-size: 14px;
    }

    input {
      display: block;
      width: 100%;
      padding: 11px 12px;
      margin: 10px 0;
      border: 1px solid #d8c9b3;
      border-radius: 8px;
      font-size: 16px;
      background: #fafaf7;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      outline: none;
      border-color: #8b5a2b;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(139, 90, 43, 0.12);
    }

    button {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: linear-gradient(135deg, #8b5a2b, #6d4620);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.05s ease, box-shadow 0.15s ease;
      margin-top: 6px;
    }

    button:hover {
      box-shadow: 0 4px 14px rgba(139, 90, 43, 0.35);
    }

    button:active { transform: scale(0.98); }

    .e {
      color: #c0392b;
      margin: 8px 0 4px;
      font-size: 14px;
      background: #fdeceb;
      padding: 8px 12px;
      border-radius: 6px;
      border-left: 3px solid #c0392b;
    }
  </style>
</head>
<body>
  {% include '_csrf.html' %}
  <form method="post" action="/admin/login">
    <h2>{{ cafe }}</h2>
    <p>Admin sign in</p>
    {% if err %}<div class="e">{{ err }}</div>{% endif %}
    <input name="username" placeholder="Username" autocomplete="username" required autofocus>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button>Sign in</button>
  </form>
</body>
</html>
