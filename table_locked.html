<!doctype html><html><head><meta charset=utf-8>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table in use — {{ cafe }}</title>
<style>
  body{font-family:system-ui;background:#f4efe9;margin:0;padding:40px 20px;color:#2b2118}
  .box{max-width:420px;margin:0 auto;background:#fff;border-radius:14px;padding:28px;text-align:center;box-shadow:0 2px 12px #0001}
  h1{margin:0 0 8px;color:#8b5a2b;font-size:22px}
  p{color:#666;line-height:1.5;margin:6px 0}
  .emoji{font-size:48px;margin-bottom:12px}
  a.btn{display:inline-block;margin-top:16px;background:#8b5a2b;color:#fff;padding:10px 20px;border-radius:8px;text-decoration:none;font-weight:600}
</style></head>
<body>
<div class="box">
  <div class="emoji">🔒</div>
  <h1>Table {{ table.name }} is currently in use</h1>
  <p>Someone is already ordering from this table.</p>
  <p>If you were the previous customer on this table, please tap "Not you?" on your device or ask staff for help.</p>
  <a class="btn" href="/menu">Back to menu</a>
</div>
</body></html>
